version: 1
run_name: dsv32-b200-mixed-1600-150
output_dir: ./results

docker:
  image: vllm/vllm-openai:v0.20.2
  model_path: /root/models/deepseek-ai/DeepSeek-V3.2
  compile_cache_path: /root/vllm-compile-cache
  environment:
    VLLM_ENGINE_READY_TIMEOUT_S: "1200"

jobs:
  - name: mixed-1600-150
    serve:
      fixed_args:
        --trust-remote-code:
        --load-format: fastsafetensors
        --enable-chunked-prefill:
        --no-enable-prefix-caching:
        --max-num-batched-tokens: 16384
        --kernel-config.enable_flashinfer_autotune: "False"
        --reasoning-parser: deepseek_v3
        --tokenizer-mode: deepseek_v32
        --tool-call-parser: deepseek_v32
        --enable-auto-tool-choice:
      variants:
        - name: tp8
          args:
            -tp: 8
        - name: dp8-ep
          args:
            -dp: 8
            -ep:

    bench:
      fixed_args:
        --backend: vllm
        --endpoint: /v1/completions
        --tokenizer-mode: deepseek_v32
        --trust-remote-code:
        --dataset-name: random
        --random-range-ratio: 0.0
        --num-prompts: 64
        --request-rate: inf
        --temperature: 0
        --num-warmups: 2
        --disable-tqdm:
      stages:
        prefill:
          enabled: false
        decode:
          enabled: true
          selection:
            # Only successful points whose measured mean TPOT is strictly
            # below 50 ms are eligible for best_results.json.
            mean_tpot_ms_lt: 50
          args:
            # A mixed online workload: every request includes both prefill
            # and decode work, with fixed lengths.
            --random-input-len: 1600
            --random-output-len: 150
            --ignore-eos:

    sweep:
      args:
        --workload-var: max_concurrency
        --workload-iters: 6
        --server-ready-timeout: 1200
        --num-runs: 1
        --show-stdout:
