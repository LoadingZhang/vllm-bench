version: 1
run_name: dsv32-b200
output_dir: ./results

environment:
  MODEL_PATH: /models/deepseek-ai/DeepSeek-V3.2
  VLLM_ENGINE_READY_TIMEOUT_S: "1200"

docker:
  image: vllm/vllm-openai:v0.20.2
  host_models_path: /absolute/path/to/models

jobs:
  - name: dsv32
    serve:
      fixed_args:
        --trust-remote-code: 
        --load-format: fastsafetensors
        --kernel-config.enable_flashinfer_autotune: "False"
        --enable-chunked-prefill: 
        --reasoning-parser: deepseek_v3
        --tokenizer-mode: deepseek_v32
        --tool-call-parser: deepseek_v32
        --enable-auto-tool-choice: 
        --no-enable-prefix-caching: 
      variants:
        - name: tp8
          args:
            -tp: 8
        - name: tp8-ep
          args:
            -tp: 8
            -ep: 
        - name: dp8-ep
          args:
            -dp: 8
            -ep: 

    bench:
      fixed_args:
        --backend: vllm
        --endpoint: /v1/completions
        --tokenizer-mode: deepseek_v32
        --trust-remote-code: 
        --dataset-name: random
        --random-range-ratio: 0.0
        --num-prompts: 64
        --request-rate: inf
        --temperature: 0
        --num-warmups: 100
        --disable-tqdm: 
      stages:
        prefill:
          enabled: true
          args:
            --random-input-len: 8192
            --random-output-len: 1
        decode:
          enabled: true
          args:
            --random-input-len: 128
            --random-output-len: 8192

    sweep:
      args:
        --workload-var: max_concurrency
        --workload-iters: 6
        --server-ready-timeout: 1200
        --num-runs: 1
        --show-stdout: 
