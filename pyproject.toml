[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vllm-bench"
version = "0.1.0"
description = "Docker-based automated prefill and decode benchmarking for vLLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
vllm-bench = "vllm_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
